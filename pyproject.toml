[project]
name = "srs"
version = "0.1.0"
description = "Safety refusal study: under- and over-refusal of LLMs, and the reliability of the evaluators that measure it"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50",
    "tenacity>=8.5",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "datasets>=3.0",
    "mlx-lm>=0.19",
    "transformers>=4.45",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "krippendorff>=0.8",
    "streamlit>=1.39",
    "matplotlib>=3.9",
    "anthropic>=1.15.0",
]

[project.scripts]
srs = "srs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
