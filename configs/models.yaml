# Model IDs chosen 2026-10-11 (task 9.1) to minimise cost. Each family uses ONE base model with
# thinking off (-a) and on (-b), so the a/b contrast isolates thinking rather than model size.
# Capability flags (design D2) decide which request parameters are sent.
#   token_param:          max_tokens | max_completion_tokens
#   structured_output:    json_schema | json_object | none
#   price_*_per_mtok:     USD per million tokens, used only for dry-run cost estimates
models:
  # Gemini 2.5 models are closed to new users, and Gemini 3+ cannot fully disable thinking, so
  # gemini-a uses "minimal" (report it as minimised, not off). The compat endpoint leaves
  # thinking tokens out of completion_tokens; they are billed and equal
  # total - prompt - completion. Seed and strict json_schema support: confirm in the pilot.
  gemini-a:
    provider: google
    model: gemini-3.1-flash-lite
    family: gemini
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_schema
    is_reasoning: false
    extra_body: {reasoning_effort: minimal}
    price_in_per_mtok: 0.25
    price_out_per_mtok: 1.50
  gemini-b:
    provider: google
    model: gemini-3.1-flash-lite
    family: gemini
    token_param: max_tokens
    supports_temperature: false   # Google advises keeping thinking models at the default 1.0
    supports_seed: false
    structured_output: json_schema
    is_reasoning: true
    extra_body: {reasoning_effort: high}
    price_in_per_mtok: 0.25
    price_out_per_mtok: 1.50

  # deepseek-flash = DeepSeek-V4.1-Flash; thinking is on by default. Prices are peak rates;
  # off-peak (outside 01-04 and 06-10 UTC on weekdays, plus weekends) is half price.
  # Temperature is ignored in thinking mode.
  deepseek-a:
    provider: deepseek
    model: deepseek-flash
    family: deepseek
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    is_reasoning: false
    extra_body: {thinking: {type: disabled}}
    price_in_per_mtok: 0.30
    price_out_per_mtok: 1.20
  deepseek-b:
    provider: deepseek
    model: deepseek-flash
    family: deepseek
    token_param: max_tokens
    supports_temperature: false
    supports_seed: false
    structured_output: json_object
    is_reasoning: true
    extra_body: {thinking: {type: enabled}}
    price_in_per_mtok: 0.30
    price_out_per_mtok: 1.20

  # Qwen3.8-Flash replaced Kimi K2.6 on 2026-10-17 for cost (~10x cheaper output). Thinking is a
  # true on/off switch (enable_thinking), and thinking tokens are billed as output. Confirm in
  # the Qwen pilot that non-streaming calls accept enable_thinking: true and which error code
  # content-inspection blocks use. Prices converted from CNY 0.8 / 2.7 (Bailian, Beijing region,
  # after the 2026-08-27 price cut) at ~7.1 CNY/USD.
  qwen-a:
    provider: alibaba
    model: qwen3.8-flash
    family: qwen
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    is_reasoning: false
    extra_body: {enable_thinking: false}
    price_in_per_mtok: 0.11
    price_out_per_mtok: 0.38
  qwen-b:
    provider: alibaba
    model: qwen3.8-flash
    family: qwen
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    is_reasoning: true
    extra_body: {enable_thinking: true}
    price_in_per_mtok: 0.11
    price_out_per_mtok: 0.38

  # GLM-5.3 since 2026-10-18 (was GLM-5.3-Flash), billed from a 20M-token GLM-5.3 resource pack.
  # It cannot disable thinking, so glm-a uses reasoning_effort "low" and glm-b "max" (like
  # gemini-a, report glm-a as minimised, not off). The GLM pilot confirms that "low" is accepted
  # and how often glm-a hits the 1024-token limit, since thinking counts toward it.
  # No per-token price: the pack prepays it, so dry runs show no cost for GLM.
  glm-a:
    provider: zhipu
    model: glm-5.3
    family: glm
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    is_reasoning: false
    extra_body: {reasoning_effort: low}
  glm-b:
    provider: zhipu
    model: glm-5.3
    family: glm
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    is_reasoning: true
    extra_body: {reasoning_effort: max}

  # Utility roles: judges, framing rewriter / intent checker, category and tier screens.
  # The judges are cheap tiers with thinking minimised/off, so the rationale-first JSON does
  # the reasoning. judge-gemini stays the category/tier labeler and the framing rewriter.
  judge-gemini:
    provider: google
    model: gemini-3.1-flash-lite
    family: gemini
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_schema
    extra_body: {reasoning_effort: minimal}
    price_in_per_mtok: 0.25
    price_out_per_mtok: 1.50
  # Judge A since 2026-10-15: a family outside the evaluated ones, so Judge A has no
  # self-preference. Haiku 5.5 rejects non-default sampling parameters, so it runs at the
  # default temperature (Judge B runs at 0). Thinking off is accepted at effort high or below.
  # Its safety classifiers can decline a request (stop_reason "refusal", no server-side
  # fallback); those become blocked judgments and count toward the pilot's 5% check.
  judge-claude:
    provider: anthropic
    model: claude-haiku-5-5
    family: claude
    token_param: max_tokens
    supports_temperature: false
    supports_seed: false
    structured_output: json_schema
    extra_body: {thinking: {type: disabled}}
    price_in_per_mtok: 0.10
    price_out_per_mtok: 0.50
  judge-deepseek:
    provider: deepseek
    model: deepseek-flash
    family: deepseek
    token_param: max_tokens
    supports_temperature: true
    supports_seed: false
    structured_output: json_object
    extra_body: {thinking: {type: disabled}}
    price_in_per_mtok: 0.30
    price_out_per_mtok: 1.20

evaluated: [gemini-a, gemini-b, deepseek-a, deepseek-b, qwen-a, qwen-b, glm-a, glm-b]
